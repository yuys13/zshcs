name: Rust CI
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Rust
        run: |
          rustup show
      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --no-deps --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Install dependencies for tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Install dependencies for tests (macOS)
        if: runner.os == 'macOS'
        run: |
          which zsh || HOMEBREW_NO_AUTO_UPDATE=1 brew install zsh
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Zsh script unit tests
        run: zsh tests/zsh/run_tests.zsh
  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Rust
        run: |
          rustup --version
          rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Install dependencies for tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Test with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Run octocov
        uses: k1LoW/octocov-action@v1.5.2
  rust-all-checks:
    if: always()
    needs: [build, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Rust CI checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some checks failed or were cancelled."
            exit 1
          fi
          echo "All Rust CI checks passed."
