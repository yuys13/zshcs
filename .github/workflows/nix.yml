name: Nix CI
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Format Check
        run: nix fmt -- --ci
      - name: Flake Check
        run: nix flake check --no-build --all-systems --keep-going
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Clippy
        run: nix develop --command cargo clippy --no-deps --all-targets -- -D warnings
      - name: Build
        run: nix develop --command cargo build --release
      - name: Run tests
        run: nix develop --command cargo test
      - name: Nix Build
        run: nix build
  nix-all-checks:
    if: always()
    needs: [flake-check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Nix CI checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some checks failed or were cancelled."
            exit 1
          fi
          echo "All Nix CI checks passed."
