name: Nix CI
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: Format Check
        run: nix fmt -- --ci
      - name: Flake Check
        run: nix flake check --no-build --all-systems --keep-going
  dev-shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check devShell (Clippy, Build, Test)
        run: |
          nix develop --command bash -c "
            set -euo pipefail
            cargo clippy --no-deps --all-targets -- -D warnings
            cargo build --release
            cargo test
          "
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: Nix Build
        run: nix build
  nix-all-checks:
    if: always()
    needs: [flake-check, dev-shell, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Nix CI checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some checks failed or were cancelled."
            exit 1
          fi
          echo "All Nix CI checks passed."
