[package]
name = "zshcs"
version = "0.1.0"
edition = "2024"

[dependencies]
tower-lsp = "0.20.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] } # Add serde and enable the derive feature
serde_json = "1.0"
dashmap = "6.2.1"
tempfile = "3.27.0"
thiserror = "2.0"
clap = { version = "=4.5.60", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = "0.8"
futures = "0.3"
rstest = "0.29.0"

[[bench]]
name = "parser_benchmark"
harness = false

